# Essai temporaire (20 nov. 2026) : les heures des mesures Candhis sont-elles en UTC ?
# Méthode : retrouver les mêmes bouées (Espiguette 03001, Sète 03404) dans une source qui donne l'heure en UTC
# (EMODnet Physics ERDDAP, données Copernicus / Coriolis) et comparer les séries avec houle.json décalé de 0 et de -1 h.
name: essai-fuseau-candhis
on:
  push:
    branches: [essai-fuseau-candhis]
permissions:
  contents: read
jobs:
  fuseau:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Pages du site Candhis (mention de l'heure)
        run: |
          for u in "https://candhis.cerema.fr/" "https://candhis.cerema.fr/_public_/campagne.php?Y2FtcD0wMzAwMQ==" "https://candhis.cerema.fr/_public_/campagne.php?Y2FtcD0wMzQwNA==" "https://candhis.cerema.fr/_public_/aide.php" "https://candhis.cerema.fr/_public_/faq.php"; do
            echo "== $u"; curl -sS -m 60 -L "$u" -o /tmp/p.html -w "%{http_code} %{size_download}\n" || continue
            iconv -f latin1 -t utf8 /tmp/p.html 2>/dev/null | sed 's/<[^>]*>/ /g' | tr -s ' \n' ' ' | grep -o -i -E '.{0,80}(\bTU\b|UTC|GMT|heure l[ée]gale|heure locale|temps universel).{0,80}' | head -10
          done
      - name: Mesures Candhis gardées (houle.json)
        run: |
          git init -q /tmp/d && cd /tmp/d && git fetch -q --depth=1 "https://github.com/${{ github.repository }}" donnees && git show FETCH_HEAD:houle.json > /tmp/houle.json
          python3 -c "import json;d=json.load(open('/tmp/houle.json'));[print(b['nom'],[(m['t'][5:16],m['h']) for m in b['mesures'][-12:]]) for b in d['bouees']]"
