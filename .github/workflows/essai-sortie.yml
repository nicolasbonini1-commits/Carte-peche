# Essai ponctuel (20 nov. 2026) : feux et jetées de l'embouchure du Lez à Palavas dans OpenStreetMap (Overpass). Écrit dans essais-sortie.
name: essai-sortie
on:
  push:
    branches: [essai-sortie-21nov]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  osm:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir -p /tmp/out
          Q='[out:json][timeout:60];(node["seamark:type"](43.515,3.915,43.535,3.950);way["man_made"~"breakwater|pier|groyne"](43.515,3.915,43.535,3.950);way["waterway"="river"]["name"~"Lez"](43.515,3.915,43.540,3.950););out body geom;'
          for U in https://overpass-api.de/api/interpreter https://overpass.private.coffee/api/interpreter https://overpass.kumi.systems/api/interpreter; do
            curl -sS -m 90 -A "Carte-peche/1.0 (github.com/nicolasbonini1-commits/Carte-peche)" -H "Accept: application/json" --data-urlencode "data=$Q" "$U" -o /tmp/out/osm_lez.json && head -c 1 /tmp/out/osm_lez.json | grep -q "{" && echo "OK $U" && break
          done
          head -c 400 /tmp/out/osm_lez.json
      - run: |
          cd /tmp && git clone -q --depth 1 -b essais-sortie "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" d && cd d
          cp /tmp/out/osm_lez.json .
          git config user.name "essai-bot"; git config user.email "essai@users.noreply.github.com"
          git add . && git commit -qm "osm Lez $(date '+%d/%m %H:%M')" && git push -q origin essais-sortie
