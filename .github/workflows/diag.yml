name: diag-api
on:
  push:
    branches: [essais-api]
    paths: [".github/workflows/diag.yml", "diag/urls.txt", "diag/postes.py"]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Interroger les API
        run: |
          mkdir -p diag/out
          n=0
          while IFS='|' read -r name url; do
            [ -z "$name" ] && continue
            n=$((n+1))
            curl -sS -m 60 -A "carte-peche-diag/1.0 (github nicolasbonini1-commits)" --retry 2 --retry-delay 5 -D "diag/out/$name.headers" -H "Origin: https://nicolasbonini1-commits.github.io" "$url" -o "diag/out/$name.json" || echo "curl error" > "diag/out/$name.err"
            # résumé : clés et 3 premières valeurs de chaque tableau
            python3 - "$name" <<'PY'
          import json,sys
          n=sys.argv[1]
          import os
          if not os.path.exists(f"diag/out/{n}.json"): sys.exit()
          try:
            d=json.load(open(f"diag/out/{n}.json"))
          except Exception as e:
            open(f"diag/out/{n}.summary","w").write("NON JSON: "+open(f"diag/out/{n}.json",errors="replace").read()[:1500]); sys.exit()
          def summ(x,depth=0):
            out=[]
            if isinstance(x,list):
              out.append(f"list[{len(x)}]")
              if x and isinstance(x[0],(dict,list)): out+= ["  "+l for l in summ(x[0],depth+1)]
              else: out.append("  "+json.dumps(x[:3])+(" ... last="+json.dumps(x[-3:]) if len(x)>3 else ""))
            elif isinstance(x,dict):
              for k,v in x.items():
                if isinstance(v,(dict,list)): out.append(f"{k}:"); out+=["  "+l for l in summ(v,depth+1)]
                else: out.append(f"{k}: {json.dumps(v)[:200]}")
            return out
          open(f"diag/out/{n}.summary","w").write("\n".join(summ(d))[:20000])
          PY
            case "$name" in hub_st_*|app_*|nomi_*) ;; *) rm -f "diag/out/$name.json";; esac
          done < diag/urls.txt
      - name: Leaflet
        run: curl -sS -o diag/out/leaflet.js https://unpkg.com/leaflet@1.9.4/dist/leaflet.js; curl -sS -o diag/out/leaflet.css https://unpkg.com/leaflet@1.9.4/dist/leaflet.css
      - name: Enregistrer
        run: |
          git config user.name "diag-bot"; git config user.email "diag@users.noreply.github.com"
          git add diag/out; git commit -m "diag: résultats" || true; git pull --rebase -q || true; git push
