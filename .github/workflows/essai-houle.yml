# Essai temporaire (branche houle) : houle mesurée Candhis dans l'appli. Captures et résultats dans la branche essais-houle-captures.
name: essai-houle
on:
  push:
    branches: [houle]
    paths: [".github/workflows/essai-houle.yml", "diag/essai_houle.py", "js/**", "notif/houle.js", "sw.js"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  essai:
    runs-on: ubuntu-latest
    env:
      K: ${{ secrets.CANDHIS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Vraies réponses Candhis et Open-Meteo → houle.json
        run: |
          mkdir -p /tmp/h
          node notif/houle.js urls | while read -r n u; do
            case "$n" in
              candhis_*) curl -sS -m 60 -H "Authorization: $K" "$u" -o "/tmp/h/$n.json" ;;
              *) curl -sS -m 90 --retry 3 "$u" -o "/tmp/h/$n.json" ;;
            esac
          done
          node notif/houle.js /tmp/h /dev/null > /tmp/houle.json
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: python diag/essai_houle.py
      - name: Ranger les résultats dans la branche essais-houle-captures
        if: always()
        run: |
          mkdir -p diag/out && cd diag/out && git init -q -b essais-houle-captures && git add -A
          git -c user.name=essai -c user.email=essai@example.invalid commit -q -m "essai houle" --allow-empty
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" essais-houle-captures
